<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍌 پنل ادمین موز کده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  :root {
    --bg: #0a0a0a;
    --bg2: #0f0f0f;
    --card: #151515;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #8a8a8a;
    --yellow: #facc15;
    --yellow-soft: #fde047;
    --yellow-dark: #a16207;
    --danger: #dc2626;
    --success: #22c55e;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 60px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
  }

  #particles {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }
  .container {
    max-width: 720px; margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* ============ هدر ============ */
  header {
    text-align: center; padding: 20px 0 28px;
    border-bottom: 1px solid var(--border); margin-bottom: 28px;
  }
  header .logo {
    font-size: 52px; display: inline-block;
    animation: float 3.5s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(250,204,21,0.4));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }
  header h1 {
    font-size: 28px; font-weight: 800; letter-spacing: 3px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 25px rgba(250,204,21,0.3));
  }
  header p { color: var(--muted); font-size: 12px; margin-top: 6px; letter-spacing: 1px; }

  /* ============ کارت‌ها ============ */
  .card {
    background: rgba(21,21,21,0.85);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 22px; margin-bottom: 16px;
    backdrop-filter: blur(10px);
    animation: slideUp 0.5s ease both;
    position: relative; overflow: hidden;
    transition: all 0.3s ease;
  }
  .card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--yellow), transparent);
    opacity: 0.6;
  }
  .card:hover {
    border-color: rgba(250,204,21,0.4);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 30px rgba(250,204,21,0.08);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.2s; }

  label {
    display: block; margin-bottom: 10px;
    font-size: 11px; color: var(--yellow); letter-spacing: 2px;
    text-transform: uppercase; font-weight: 700;
  }

  input[type="password"], input[type="file"] {
    width: 100%; padding: 12px 15px; border-radius: 9px;
    border: 1px solid var(--border); background: rgba(15,15,15,0.8);
    color: var(--text); font-size: 13px; font-family: inherit;
    transition: all 0.25s;
  }
  input[type="password"]:focus {
    outline: none; border-color: var(--yellow);
    box-shadow: 0 0 0 3px rgba(250,204,21,0.15);
  }
  input[type="file"]::file-selector-button {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; border: none; padding: 7px 16px; border-radius: 6px;
    cursor: pointer; margin-left: 12px; font-weight: 700;
    font-family: inherit; font-size: 12px;
  }

  button {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; border: none; padding: 13px 22px; border-radius: 9px;
    cursor: pointer; font-size: 14px; font-weight: 700;
    font-family: inherit; width: 100%; margin-top: 12px;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(250,204,21,0.4);
  }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  button.danger {
    background: transparent; color: var(--danger);
    border: 1px solid var(--danger);
  }
  button.danger:hover {
    background: var(--danger); color: #fff;
    box-shadow: 0 8px 25px rgba(220,38,38,0.4);
  }

  /* ============ ضبط ویس ============ */
  .recorder {
    background: rgba(15,15,15,0.8);
    border: 1px dashed var(--border);
    border-radius: 12px; padding: 28px 20px; text-align: center;
    margin-top: 8px;
    transition: all 0.3s;
  }
  .recorder.recording {
    border-color: var(--danger);
    background: rgba(220,38,38,0.05);
  }
  .rec-btn {
    width: 90px; height: 90px; border-radius: 50%;
    border: 2px solid var(--yellow);
    background: rgba(250,204,21,0.08);
    color: var(--yellow); font-size: 36px;
    cursor: pointer; margin: 0 auto; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.3s; padding: 0;
    box-shadow: 0 0 30px rgba(250,204,21,0.15);
  }
  .rec-btn:hover {
    background: rgba(250,204,21,0.15);
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(250,204,21,0.3);
  }
  .rec-btn.recording {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.7); }
    50% { box-shadow: 0 0 0 20px rgba(220,38,38,0); }
  }
  .rec-status {
    margin-top: 16px; font-size: 13px; color: var(--muted);
    transition: color 0.3s;
  }
  .rec-status.active { color: var(--danger); font-weight: 700; }
  .rec-preview { margin-top: 16px; }
  .rec-preview audio { width: 100%; border-radius: 8px; }

  /* ============ پیام‌ها ============ */
  .msg {
    margin-top: 14px; padding: 13px; border-radius: 9px;
    font-size: 13px; display: none; text-align: center;
    font-weight: 600; animation: slideUp 0.3s ease;
  }
  .msg.success {
    background: rgba(34,197,94,0.1); color: var(--success);
    border: 1px solid rgba(34,197,94,0.3); display: block;
  }
  .msg.error {
    background: rgba(220,38,38,0.1); color: #f87171;
    border: 1px solid rgba(220,38,38,0.3); display: block;
  }

  /* ============ شمارنده ============ */
  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: rgba(15,15,15,0.8); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; text-align: center;
  }
  .stat .val {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* ============ پروگرس ============ */
  .progress {
    height: 5px; background: rgba(255,255,255,0.05);
    border-radius: 3px; margin-top: 14px; overflow: hidden;
    display: none;
  }
  .progress.active { display: block; }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--yellow-soft));
    width: 0; transition: width 0.3s;
    box-shadow: 0 0 15px rgba(250,204,21,0.6);
  }

  /* ============ لیست فایل‌ها ============ */
  .file-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    gap: 10px; animation: slideUp 0.3s ease both;
    transition: background 0.2s;
  }
  .file-row:hover {
    background: rgba(250,204,21,0.03);
    padding-right: 8px; padding-left: 8px;
    border-radius: 6px;
  }
  .file-row:last-child { border-bottom: none; }
  .file-row .info { flex: 1; min-width: 0; }
  .file-row .fname {
    font-size: 13px; word-break: break-all;
    margin-bottom: 3px; font-weight: 500;
  }
  .file-row .fmeta { font-size: 11px; color: var(--muted); }
  .file-row button {
    width: auto; padding: 6px 14px; font-size: 12px;
    margin: 0; background: transparent;
    color: var(--danger); border: 1px solid var(--danger);
  }
  .file-row button:hover {
    background: var(--danger); color: #fff;
    box-shadow: 0 4px 15px rgba(220,38,38,0.4);
  }

  .empty {
    text-align: center; padding: 30px 20px;
    color: var(--muted); font-size: 13px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 22px; }
    .rec-btn { width: 75px; height: 75px; font-size: 30px; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <header>
    <div class="logo">🍌</div>
    <h1>پنل ادمین</h1>
    <p>MOZ KADE • ADMIN PANEL</p>
  </header>

  <div class="card">
    <label>🔐 رمز ادمین</label>
    <input type="password" id="password" placeholder="رمز را وارد کنید" autocomplete="current-password">
  </div>

  <div class="card">
    <label>📤 آپلود فایل</label>
    <input type="file" id="fileInput">
    <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
    <button onclick="uploadFile()">⬆ آپلود به موز کده</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <label>🎤 ضبط ویس</label>
    <div class="recorder" id="recorder">
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
      <div class="rec-status" id="recStatus">برای شروع ضبط کلیک کن</div>
      <div class="rec-preview" id="recPreview"></div>
    </div>
    <button id="uploadVoiceBtn" onclick="uploadVoice()" style="display:none;">⬆ آپلود ویس</button>
  </div>

  <div class="card">
    <label>📊 آمار</label>
    <div class="stats">
      <div class="stat">
        <div class="val" id="statCount">0</div>
        <div class="lbl">تعداد فایل</div>
      </div>
      <div class="stat">
        <div class="val" id="statSize">0 MB</div>
        <div class="lbl">حجم مصرفی</div>
      </div>
    </div>
    <div id="fileList"></div>
    <button class="danger" onclick="deleteAll()" style="margin-top:16px;">🗑️ حذف همه محتواها</button>
    <button class="danger" onclick="clearChat()" style="margin-top:8px;">🧹 پاک کردن چت</button>
  </div>
</div>

<script>
// ============ ذرات زرد ============
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = window.innerWidth < 600 ? 20 : 40;
  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.2,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;

      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      gradient.addColorStop(0, `rgba(250, 204, 21, ${alpha})`);
      gradient.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 130) {
          ctx.strokeStyle = `rgba(250, 204, 21, ${(1 - dist/130) * 0.12})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ============ متغیرها ============
const passwordInput = document.getElementById('password');
const fileInput = document.getElementById('fileInput');
const msgDiv = document.getElementById('msg');
const progressDiv = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');

passwordInput.value = localStorage.getItem('mozPass') || '';
passwordInput.addEventListener('change', () => {
  localStorage.setItem('mozPass', passwordInput.value);
  loadFiles();
});

function showMsg(text, isError) {
  msgDiv.textContent = text;
  msgDiv.className = 'msg ' + (isError ? 'error' : 'success');
  setTimeout(() => { msgDiv.className = 'msg'; }, 4000);
}

// ============ آپلود ============
function uploadFile() {
  const password = passwordInput.value;
  const file = fileInput.files[0];
  if (!password) return showMsg('رمز ادمین را وارد کنید', true);
  if (!file) return showMsg('یک فایل انتخاب کنید', true);
  doUpload(file, file.name);
}

function doUpload(file, name) {
  const password = passwordInput.value;
  const formData = new FormData();
  formData.append('file', file, name);

  const xhr = new XMLHttpRequest();
  progressDiv.classList.add('active');
  progressBar.style.width = '0%';

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) progressBar.style.width = (e.loaded / e.total * 100) + '%';
  };

  xhr.onload = () => {
    progressDiv.classList.remove('active');
    if (xhr.status === 200) {
      showMsg('✅ با موفقیت آپلود شد', false);
      fileInput.value = '';
      document.getElementById('recPreview').innerHTML = '';
      document.getElementById('uploadVoiceBtn').style.display = 'none';
      loadFiles();
    } else {
      try { showMsg('❌ ' + JSON.parse(xhr.responseText).error, true); }
      catch (e) { showMsg('❌ خطا در آپلود', true); }
    }
  };

  xhr.onerror = () => {
    progressDiv.classList.remove('active');
    showMsg('❌ خطا در ارتباط', true);
  };

  xhr.open('POST', '/api/upload');
  xhr.setRequestHeader('x-admin-password', password);
  xhr.send(formData);
}

// ============ ضبط ویس ============
let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;
let isRecording = false;

async function toggleRecord() {
  if (isRecording) { mediaRecorder.stop(); return; }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      isRecording = false;
      document.getElementById('recBtn').classList.remove('recording');
      document.getElementById('recBtn').textContent = '🎤';
      document.getElementById('recorder').classList.remove('recording');
      document.getElementById('recStatus').className = 'rec-status';
      document.getElementById('recStatus').textContent = 'ضبط تمام شد. می‌تونی گوش کنی یا آپلود کنی.';

      recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(recordedBlob);
      document.getElementById('recPreview').innerHTML = `<audio controls src="${url}"></audio>`;
      document.getElementById('uploadVoiceBtn').style.display = 'block';
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recBtn').textContent = '⏹';
    document.getElementById('recorder').classList.add('recording');
    document.getElementById('recStatus').className = 'rec-status active';
    document.getElementById('recStatus').textContent = '🔴 در حال ضبط... برای توقف کلیک کن';
    document.getElementById('recPreview').innerHTML = '';
    document.getElementById('uploadVoiceBtn').style.display = 'none';
  } catch (e) {
    showMsg('❌ دسترسی به میکروفون داده نشد', true);
  }
}

function uploadVoice() {
  if (!recordedBlob) return;
  const password = passwordInput.value;
  if (!password) return showMsg('رمز ادمین را وارد کنید', true);
  const name = 'voice-' + new Date().toISOString().slice(0,19).replace(/[:T]/g, '-') + '.webm';
  const file = new File([recordedBlob], name, { type: 'audio/webm' });
  doUpload(file, name);
}

// ============ لیست فایل‌ها ============
async function loadFiles() {
  const res = await fetch('/api/files');
  const files = await res.json();

  const totalSize = files.reduce((sum, f) => sum + (f.size || 0), 0);
  const totalMB = (totalSize / 1024 / 1024).toFixed(1);
  const percent = ((totalSize / (800 * 1024 * 1024)) * 100).toFixed(1);

  document.getElementById('statCount').textContent = files.length;
  document.getElementById('statSize').textContent = totalMB + ' MB';
  document.getElementById('statSize').title = percent + '% از ۸۰۰ مگ';

  const list = document.getElementById('fileList');
  if (!files.length) {
    list.innerHTML = '<div class="empty">فایلی موجود نیست</div>';
    return;
  }
  list.innerHTML = files.map(f => {
    const size = f.size < 1024 * 1024
      ? (f.size / 1024).toFixed(1) + ' KB'
      : (f.size / 1024 / 1024).toFixed(1) + ' MB';
    const date = new Date(f.uploadedAt).toLocaleDateString('fa-IR');
    const icon = f.type === 'image' ? '🖼' : f.type === 'audio' ? '🎵' : f.type === 'video' ? '🎬' : '📄';
    return `<div class="file-row">
      <div class="info">
        <div class="fname">${icon} ${f.originalName}</div>
        <div class="fmeta">${size} • ${date}</div>
      </div>
      <button onclick="deleteFile('${f.id}')">حذف</button>
    </div>`;
  }).join('');
}

async function deleteFile(id) {
  const password = passwordInput.value;
  if (!password) return showMsg('رمز را وارد کنید', true);
  if (!confirm('مطمئنی؟')) return;
  const res = await fetch('/api/files/' + id, {
    method: 'DELETE',
    headers: { 'x-admin-password': password }
  });
  if (res.ok) { showMsg('🗑 حذف شد', false); loadFiles(); }
  else showMsg('❌ خطا در حذف', true);
}

async function deleteAll() {
  const password = passwordInput.value;
  if (!password) return showMsg('رمز را وارد کنید', true);
  if (!confirm('همه محتواها پاک شوند؟')) return;
  const res = await fetch('/api/all', {
    method: 'DELETE',
    headers: { 'x-admin-password': password }
  });
  if (res.ok) { showMsg('🗑 همه پاک شد', false); loadFiles(); }
  else showMsg('❌ خطا', true);
}

async function clearChat() {
  const password = passwordInput.value;
  if (!password) return showMsg('رمز را وارد کنید', true);
  if (!confirm('کل چت پاک شود؟')) return;
  const res = await fetch('/api/chat', {
    method: 'DELETE',
    headers: { 'x-admin-password': password }
  });
  if (res.ok) showMsg('🧹 چت پاک شد', false);
  else showMsg('❌ خطا', true);
}

loadFiles();
</script>
</body>
</html>
