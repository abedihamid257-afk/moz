<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍌 پنل ادمین موز کده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  :root {
    --bg: #0a0a0a; --bg2: #0f0f0f; --card: #151515;
    --border: #2a2a2a; --text: #f0f0f0; --muted: #8a8a8a;
    --yellow: #facc15; --yellow-soft: #fde047; --yellow-dark: #a16207;
    --danger: #dc2626; --success: #22c55e;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px 16px 60px;
    line-height: 1.6; overflow-x: hidden;
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

  header { text-align: center; padding: 20px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  header .logo { font-size: 52px; display: inline-block; animation: float 3.5s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(250,204,21,0.4)); }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  header h1 {
    font-size: 28px; font-weight: 800; letter-spacing: 3px; margin-top: 8px;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { color: var(--muted); font-size: 12px; margin-top: 6px; letter-spacing: 1px; }

  .card {
    background: rgba(21,21,21,0.85); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px; margin-bottom: 16px;
    backdrop-filter: blur(10px); animation: slideUp 0.5s ease both;
    position: relative; overflow: hidden; transition: all 0.3s;
  }
  .card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--yellow), transparent);
    opacity: 0.6;
  }
  .card:hover { border-color: rgba(250,204,21,0.4); box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 30px rgba(250,204,21,0.08); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.2s; }
  .card:nth-child(5) { animation-delay: 0.25s; }

  label {
    display: block; margin-bottom: 10px;
    font-size: 11px; color: var(--yellow); letter-spacing: 2px;
    text-transform: uppercase; font-weight: 700;
  }
  input[type="password"], input[type="text"], input[type="file"], select, textarea {
    width: 100%; padding: 12px 15px; border-radius: 9px;
    border: 1px solid var(--border); background: rgba(15,15,15,0.8);
    color: var(--text); font-size: 13px; font-family: inherit;
    transition: all 0.25s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--yellow);
    box-shadow: 0 0 0 3px rgba(250,204,21,0.15);
  }
  input[type="file"]::file-selector-button {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; border: none; padding: 7px 16px; border-radius: 6px;
    cursor: pointer; margin-left: 12px; font-weight: 700;
    font-family: inherit; font-size: 12px;
  }
  textarea {
    min-height: 180px; resize: vertical;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    direction: ltr; text-align: left; line-height: 1.6;
  }

  button {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; border: none; padding: 13px 22px; border-radius: 9px;
    cursor: pointer; font-size: 14px; font-weight: 700;
    font-family: inherit; width: 100%; margin-top: 12px;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(250,204,21,0.4); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  button.danger {
    background: transparent; color: var(--danger);
    border: 1px solid var(--danger);
  }
  button.danger:hover { background: var(--danger); color: #fff; box-shadow: 0 8px 25px rgba(220,38,38,0.4); }

  .recorder {
    background: rgba(15,15,15,0.8); border: 1px dashed var(--border);
    border-radius: 12px; padding: 28px 20px; text-align: center;
    margin-top: 8px; transition: all 0.3s;
  }
  .recorder.recording { border-color: var(--danger); background: rgba(220,38,38,0.05); }
  .rec-btn {
    width: 90px; height: 90px; border-radius: 50%;
    border: 2px solid var(--yellow); background: rgba(250,204,21,0.08);
    color: var(--yellow); font-size: 36px; cursor: pointer;
    margin: 0 auto; display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; padding: 0;
    box-shadow: 0 0 30px rgba(250,204,21,0.15);
  }
  .rec-btn:hover { background: rgba(250,204,21,0.15); transform: scale(1.05); box-shadow: 0 0 40px rgba(250,204,21,0.3); }
  .rec-btn.recording { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.7); }
    50% { box-shadow: 0 0 0 20px rgba(220,38,38,0); }
  }
  .rec-status { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .rec-status.active { color: var(--danger); font-weight: 700; }
  .rec-preview { margin-top: 16px; }
  .rec-preview audio { width: 100%; border-radius: 8px; }

  .msg { margin-top: 14px; padding: 13px; border-radius: 9px; font-size: 13px; display: none; text-align: center; font-weight: 600; animation: slideUp 0.3s ease; }
  .msg.success { background: rgba(34,197,94,0.1); color: var(--success); border: 1px solid rgba(34,197,94,0.3); display: block; }
  .msg.error { background: rgba(220,38,38,0.1); color: #f87171; border: 1px solid rgba(220,38,38,0.3); display: block; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat { background: rgba(15,15,15,0.8); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat .val {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .progress { height: 5px; background: rgba(255,255,255,0.05); border-radius: 3px; margin-top: 14px; overflow: hidden; display: none; }
  .progress.active { display: block; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow-soft)); width: 0; transition: width 0.3s; box-shadow: 0 0 15px rgba(250,204,21,0.6); }

  .file-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    gap: 10px; transition: background 0.2s;
  }
  .file-row:hover { background: rgba(250,204,21,0.03); padding-right: 8px; padding-left: 8px; border-radius: 6px; }
  .file-row:last-child { border-bottom: none; }
  .file-row .info { flex: 1; min-width: 0; }
  .file-row .fname { font-size: 13px; word-break: break-all; margin-bottom: 3px; font-weight: 500; }
  .file-row .fmeta { font-size: 11px; color: var(--muted); }
  .file-row button {
    width: auto; padding: 6px 14px; font-size: 12px;
    margin: 0; background: transparent; color: var(--danger);
    border: 1px solid var(--danger);
  }
  .file-row button:hover { background: var(--danger); color: #fff; }

  .empty { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 13px; }

  .tabs-sm {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: rgba(15,15,15,0.8); padding: 4px; border-radius: 10px;
    border: 1px solid var(--border);
  }
  .tab-sm {
    flex: 1; padding: 9px; text-align: center; cursor: pointer;
    border-radius: 7px; color: var(--muted); font-size: 12px;
    font-weight: 600; transition: all 0.25s;
  }
  .tab-sm.active {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000;
  }

  .row-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 10px; }

  @media (max-width: 480px) {
    header h1 { font-size: 22px; }
    .rec-btn { width: 75px; height: 75px; font-size: 30px; }
    .stats { grid-template-columns: 1fr; }
    .row-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <header>
    <div class="logo">🍌</div>
    <h1>پنل ادمین</h1>
    <p>MOZ KADE • ADMIN PANEL</p>
  </header>

  <div class="card">
    <label>🔐 رمز ادمین</label>
    <input type="password" id="password" placeholder="رمز را وارد کنید" autocomplete="current-password">
  </div>

  <div class="card">
    <label>📤 آپلود فایل</label>
    <input type="file" id="fileInput">
    <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
    <button onclick="uploadFile()">⬆ آپلود به موز کده</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <label>🎤 ضبط ویس</label>
    <div class="recorder" id="recorder">
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
      <div class="rec-status" id="recStatus">برای شروع ضبط کلیک کن</div>
      <div class="rec-preview" id="recPreview"></div>
    </div>
    <button id="uploadVoiceBtn" onclick="uploadVoice()" style="display:none;">⬆ آپلود ویس</button>
  </div>

  <div class="card">
    <label>📝 ارسال متن / کد</label>
    <div class="row-2">
      <input type="text" id="textTitle" placeholder="عنوان (مثلاً: کد پایتون سریع)" maxlength="100">
      <select id="textLang">
        <option value="text">📄 متن ساده</option>
        <option value="python">🐍 Python</option>
        <option value="javascript">⚡ JavaScript</option>
        <option value="typescript">💙 TypeScript</option>
        <option value="html">🌐 HTML</option>
        <option value="css">🎨 CSS</option>
        <option value="json">📦 JSON</option>
        <option value="bash">💻 Bash</option>
        <option value="sql">🗄️ SQL</option>
        <option value="java">☕ Java</option>
        <option value="cpp">⚙️ C++</option>
        <option value="php">🐘 PHP</option>
        <option value="go">🐹 Go</option>
        <option value="rust">🦀 Rust</option>
        <option value="yaml">📋 YAML</option>
        <option value="markdown">📝 Markdown</option>
      </select>
    </div>
    <textarea id="textContent" placeholder="متن یا کدت رو اینجا بنویس..."></textarea>
    <button onclick="sendText()">📤 ارسال به موز کده</button>
    <div class="msg" id="textMsg"></div>
  </div>

  <div class="card">
    <label>📊 آمار و مدیریت</label>
    <div class="stats">
      <div class="stat">
        <div class="val" id="statCount">0</div>
        <div class="lbl">فایل</div>
      </div>
      <div class="stat">
        <div class="val" id="statTexts">0</div>
        <div class="lbl">متن / کد</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="val" id="statSize">0 MB</div>
        <div class="lbl">حجم مصرفی از ۸۰۰ مگ</div>
      </div>
      <div class="stat">
        <div class="val" id="statPercent">0%</div>
        <div class="lbl">درصد مصرف</div>
      </div>
    </div>

    <div class="tabs-sm" style="margin-top:16px;">
      <div class="tab-sm active" onclick="switchList('files', this)">📦 فایل‌ها</div>
      <div class="tab-sm" onclick="switchList('texts', this)">📝 متن‌ها</div>
    </div>

    <div id="list-files"><div class="empty">در حال بارگذاری...</div></div>
    <div id="list-texts" style="display:none;"><div class="empty">در حال بارگذاری...</div></div>

    <button class="danger" onclick="deleteAllFiles()" style="margin-top:16px;">🗑️ حذف همه فایل‌ها</button>
    <button class="danger" onclick="deleteAllTexts()" style="margin-top:8px;">🗑️ حذف همه متن‌ها</button>
    <button class="danger" onclick="clearChat()" style="margin-top:8px;">🧹 پاک کردن چت</button>
  </div>
</div>

<script>
// ============ ذرات ============
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [], w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const COUNT = window.innerWidth < 600 ? 20 : 40;
  for (let i = 0; i < COUNT; i++) {
    particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+0.5, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, alpha: Math.random()*0.5+0.2, pulse: Math.random()*Math.PI*2 });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      gradient.addColorStop(0, `rgba(250, 204, 21, ${alpha})`);
      gradient.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 130) {
          ctx.strokeStyle = `rgba(250, 204, 21, ${(1 - dist/130) * 0.12})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ============ متغیرها ============
const passwordInput = document.getElementById('password');
const fileInput = document.getElementById('fileInput');
const msgDiv = document.getElementById('msg');
const textMsgDiv = document.getElementById('textMsg');
const progressDiv = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');

passwordInput.value = localStorage.getItem('mozPass') || '';
passwordInput.addEventListener('change', () => {
  localStorage.setItem('mozPass', passwordInput.value);
  loadAll();
});

function showMsg(el, text, isError) {
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'error' : 'success');
  setTimeout(() => { el.className = 'msg'; }, 4000);
}

// ============ آپلود فایل ============
function uploadFile() {
  const password = passwordInput.value;
  const file = fileInput.files[0];
  if (!password) return showMsg(msgDiv, 'رمز ادمین را وارد کنید', true);
  if (!file) return showMsg(msgDiv, 'یک فایل انتخاب کنید', true);
  doUpload(file, file.name);
}

function doUpload(file, name) {
  const password = passwordInput.value;
  const formData = new FormData();
  formData.append('file', file, name);

  const xhr = new XMLHttpRequest();
  progressDiv.classList.add('active');
  progressBar.style.width = '0%';

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) progressBar.style.width = (e.loaded / e.total * 100) + '%';
  };

  xhr.onload = () => {
    progressDiv.classList.remove('active');
    if (xhr.status === 200) {
      showMsg(msgDiv, '✅ با موفقیت آپلود شد', false);
      fileInput.value = '';
      document.getElementById('recPreview').innerHTML = '';
      document.getElementById('uploadVoiceBtn').style.display = 'none';
      loadAll();
    } else {
      try { showMsg(msgDiv, '❌ ' + JSON.parse(xhr.responseText).error, true); }
      catch (e) { showMsg(msgDiv, '❌ خطا در آپلود', true); }
    }
  };

  xhr.onerror = () => {
    progressDiv.classList.remove('active');
    showMsg(msgDiv, '❌ خطا در ارتباط', true);
  };

  xhr.open('POST', '/api/upload');
  xhr.setRequestHeader('x-admin-password', password);
  xhr.send(formData);
}

// ============ ضبط ویس ============
let mediaRecorder = null, audioChunks = [], recordedBlob = null, isRecording = false;

async function toggleRecord() {
  if (isRecording) { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      isRecording = false;
      document.getElementById('recBtn').classList.remove('recording');
      document.getElementById('recBtn').textContent = '🎤';
      document.getElementById('recorder').classList.remove('recording');
      document.getElementById('recStatus').className = 'rec-status';
      document.getElementById('recStatus').textContent = 'ضبط تمام شد';
      recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(recordedBlob);
      document.getElementById('recPreview').innerHTML = `<audio controls src="${url}"></audio>`;
      document.getElementById('uploadVoiceBtn').style.display = 'block';
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recBtn').textContent = '⏹';
    document.getElementById('recorder').classList.add('recording');
    document.getElementById('recStatus').className = 'rec-status active';
    document.getElementById('recStatus').textContent = '🔴 در حال ضبط...';
    document.getElementById('recPreview').innerHTML = '';
    document.getElementById('uploadVoiceBtn').style.display = 'none';
  } catch (e) {
    showMsg(msgDiv, '❌ دسترسی به میکروفون داده نشد', true);
  }
}

function uploadVoice() {
  if (!recordedBlob) return;
  const password = passwordInput.value;
  if (!password) return showMsg(msgDiv, 'رمز ادمین را وارد کنید', true);
  const name = 'voice-' + new Date().toISOString().slice(0,19).replace(/[:T]/g, '-') + '.webm';
  const file = new File([recordedBlob], name, { type: 'audio/webm' });
  doUpload(file, name);
}

// ============ ارسال متن/کد ============
async function sendText() {
  const password = passwordInput.value;
  const title = document.getElementById('textTitle').value.trim();
  const content = document.getElementById('textContent').value;
  const lang = document.getElementById('textLang').value;

  if (!password) return showMsg(textMsgDiv, 'رمز ادمین را وارد کنید', true);
  if (!content.trim()) return showMsg(textMsgDiv, 'متن خالیه', true);

  try {
    const res = await fetch('/api/texts', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-password': password
      },
      body: JSON.stringify({ title, content, lang })
    });
    const data = await res.json();
    if (res.ok) {
      showMsg(textMsgDiv, '✅ ذخیره شد', false);
      document.getElementById('textTitle').value = '';
      document.getElementById('textContent').value = '';
      loadAll();
    } else {
      showMsg(textMsgDiv, '❌ ' + (data.error || 'خطا'), true);
    }
  } catch (e) {
    showMsg(textMsgDiv, '❌ خطا در ارتباط', true);
  }
}

// ============ لیست‌ها ============
function switchList(name, el) {
  document.querySelectorAll('.tab-sm').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('list-files').style.display = name === 'files' ? 'block' : 'none';
  document.getElementById('list-texts').style.display = name === 'texts' ? 'block' : 'none';
}

async function loadAll() {
  // آمار
  try {
    const res = await fetch('/api/stats');
    const stats = await res.json();
    const mb = (stats.used / 1024 / 1024).toFixed(1);
    document.getElementById('statSize').textContent = mb + ' MB';
    document.getElementById('statPercent').textContent = stats.percent + '%';
  } catch (e) {}

  // فایل‌ها
  try {
    const res = await fetch('/api/files');
    const files = await res.json();
    document.getElementById('statCount').textContent = files.length;
    const list = document.getElementById('list-files');
    if (!files.length) {
      list.innerHTML = '<div class="empty">فایلی موجود نیست</div>';
    } else {
      list.innerHTML = files.map(f => {
        const size = f.size < 1024*1024 ? (f.size/1024).toFixed(1)+' KB' : (f.size/1024/1024).toFixed(1)+' MB';
        const date = new Date(f.uploadedAt).toLocaleDateString('fa-IR');
        const icon = f.type === 'image' ? '🖼' : f.type === 'audio' ? '🎵' : f.type === 'video' ? '🎬' : '📄';
        return `<div class="file-row">
          <div class="info">
            <div class="fname">${icon} ${escapeHtml(f.originalName)}</div>
            <div class="fmeta">${size} • ${date}</div>
          </div>
          <button onclick="deleteFile('${f.id}')">حذف</button>
        </div>`;
      }).join('');
    }
  } catch (e) {}

  // متن‌ها
  try {
    const res = await fetch('/api/texts');
    const texts = await res.json();
    document.getElementById('statTexts').textContent = texts.length;
    const list = document.getElementById('list-texts');
    if (!texts.length) {
      list.innerHTML = '<div class="empty">متنی موجود نیست</div>';
    } else {
      list.innerHTML = texts.map(t => {
        const size = t.size < 1024 ? t.size + ' B' : (t.size/1024).toFixed(1) + ' KB';
        const date = new Date(t.at).toLocaleDateString('fa-IR');
        return `<div class="file-row">
          <div class="info">
            <div class="fname">📝 ${escapeHtml(t.title)}</div>
            <div class="fmeta">${escapeHtml(t.lang)} • ${size} • ${date}</div>
          </div>
          <button onclick="deleteText('${t.id}')">حذف</button>
        </div>`;
      }).join('');
    }
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// ============ حذف ============
async function deleteFile(id) {
  const password = passwordInput.value;
  if (!password) return showMsg(msgDiv, 'رمز را وارد کنید', true);
  if (!confirm('مطمئنی؟')) return;
  const res = await fetch('/api/files/' + id, {
    method: 'DELETE',
    headers: { 'x-admin-password': password }
  });
  if (res.ok) { showMsg(msgDiv, '🗑 حذف شد', false); loadAll(); }
  else showMsg(msgDiv, '❌ خطا', true);
}
