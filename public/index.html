<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍌 موز کده</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  :root {
    --bg: #0a0a0a; --bg2: #0f0f0f; --card: #151515;
    --border: #2a2a2a; --text: #f0f0f0; --muted: #8a8a8a;
    --yellow: #facc15; --yellow-soft: #fde047; --yellow-dark: #a16207;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px 16px 120px;
    line-height: 1.6; overflow-x: hidden;
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

  .admin-btn {
    position: fixed; top: 16px; left: 16px;
    background: rgba(21,21,21,0.85); color: var(--yellow);
    border: 1px solid var(--yellow); padding: 9px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 700;
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: all 0.25s; z-index: 100;
    box-shadow: 0 4px 20px rgba(250,204,21,0.15);
    backdrop-filter: blur(10px);
  }
  .admin-btn:hover {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(250,204,21,0.5);
  }

  header { text-align: center; padding: 20px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  header .logo { font-size: 56px; display: inline-block; animation: float 3.5s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(250,204,21,0.4)); }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  header h1 {
    font-size: 32px; font-weight: 800; letter-spacing: 3px; margin-top: 8px;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 25px rgba(250,204,21,0.3));
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 24px;
    background: rgba(21,21,21,0.7); padding: 4px; border-radius: 12px;
    border: 1px solid var(--border); backdrop-filter: blur(10px);
  }
  .tab {
    flex: 1; padding: 12px 8px; text-align: center; cursor: pointer;
    border-radius: 9px; color: var(--muted); font-size: 14px;
    font-weight: 600; transition: all 0.3s ease; user-select: none;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; box-shadow: 0 4px 25px rgba(250,204,21,0.35);
  }

  .item {
    background: rgba(21,21,21,0.85); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
    transition: all 0.35s ease; animation: slideUp 0.5s ease both;
    position: relative; overflow: hidden; backdrop-filter: blur(10px);
  }
  .item::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--yellow), transparent);
    opacity: 0.7;
  }
  .item:hover {
    border-color: rgba(250,204,21,0.5); transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 30px rgba(250,204,21,0.1);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

  .item img { max-width: 100%; border-radius: 10px; cursor: zoom-in; display: block; margin: 0 auto; transition: all 0.4s; filter: saturate(0.85); }
  .item img:hover { transform: scale(1.02); filter: saturate(1.15); }
  .item audio, .item video { width: 100%; border-radius: 10px; }
  .item .file-icon { font-size: 52px; text-align: center; padding: 24px; }

  .item .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); gap: 10px;
  }
  .item .meta .name { font-weight: 600; color: var(--text); word-break: break-all; font-size: 13px; }
  .item .meta .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }

  .btn-dl {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; padding: 9px 16px; border-radius: 8px;
    text-decoration: none; font-size: 12px; font-weight: 700;
    white-space: nowrap; transition: all 0.25s; border: none; cursor: pointer;
  }
  .btn-dl:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(250,204,21,0.5); }

  /* کارت متن/کد */
  .code-card {
    background: rgba(21,21,21,0.85); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 14px; overflow: hidden;
    animation: slideUp 0.5s ease both; backdrop-filter: blur(10px);
    transition: all 0.3s; position: relative; cursor: pointer;
  }
  .code-card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--yellow), transparent);
    opacity: 0.7;
  }
  .code-card:hover { border-color: rgba(250,204,21,0.5); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  .code-head {
    padding: 12px 16px; background: rgba(15,15,15,0.8);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .code-head .title-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .code-head .title { font-size: 13px; font-weight: 700; color: var(--text); word-break: break-word; }
  .code-head .lang-badge {
    display: inline-block; background: rgba(250,204,21,0.15); color: var(--yellow);
    padding: 2px 8px; border-radius: 6px; font-size: 10px;
    font-weight: 700; text-transform: uppercase; width: fit-content;
  }
  .copy-btn {
    background: rgba(250,204,21,0.15); color: var(--yellow);
    border: 1px solid rgba(250,204,21,0.3); padding: 7px 14px;
    border-radius: 7px; cursor: pointer; font-size: 12px;
    font-weight: 700; font-family: inherit; transition: all 0.25s;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .copy-btn:hover {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000;
  }
  .copy-btn.copied { background: #22c55e; color: #fff; border-color: #22c55e; }
  .code-body { max-height: 500px; overflow: auto; background: #0d0d0d; }
  .code-body pre {
    margin: 0; padding: 16px; font-size: 13px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    line-height: 1.6; direction: ltr; text-align: left;
    white-space: pre; overflow-x: auto;
  }
  .code-body code { background: transparent !important; }
  .code-body::-webkit-scrollbar { width: 8px; height: 8px; }
  .code-body::-webkit-scrollbar-track { background: #0a0a0a; }
  .code-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
  .code-body::-webkit-scrollbar-thumb:hover { background: var(--yellow-dark); }
  .code-text { padding: 16px; font-size: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.7; }

  /* آمار و لایک */
  .stats-row {
    display: flex; gap: 14px; font-size: 11px;
    color: var(--muted); flex-wrap: wrap;
    margin-top: 6px;
  }
  .stats-row span { display: flex; align-items: center; gap: 3px; }
  .actions-row {
    display: flex; gap: 8px; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border);
  }
  .like-btn {
    background: rgba(250,204,21,0.1); color: var(--yellow);
    border: 1px solid rgba(250,204,21,0.3); padding: 7px 14px;
    border-radius: 7px; cursor: pointer; font-size: 12px;
    font-weight: 700; font-family: inherit; transition: all 0.25s;
    display: flex; align-items: center; gap: 5px;
  }
  .like-btn:hover {
    background: rgba(250,204,21,0.2);
    transform: translateY(-1px);
  }
  .like-btn.liked {
    background: linear-gradient(135deg, #ff6b6b, #ff4757);
    color: #fff; border-color: transparent;
    animation: heartBeat 0.5s;
  }
  @keyframes heartBeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(1); }
    75% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 64px; opacity: 0.3; margin-bottom: 14px; }

  .lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.96); justify-content: center; align-items: center; padding: 20px; cursor: zoom-out; backdrop-filter: blur(14px); }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95%; max-height: 95%; border-radius: 8px; box-shadow: 0 0 80px rgba(250,204,21,0.3); }
  .lightbox .close { position: absolute; top: 20px; left: 20px; background: rgba(250,204,21,0.15); border: 1px solid var(--yellow); color: var(--yellow); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all 0.25s; }
  .lightbox .close:hover { background: var(--yellow); color: #000; transform: rotate(90deg); }

  .chat-box { background: rgba(21,21,21,0.85); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; backdrop-filter: blur(10px); }
  .chat-head { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; background: rgba(15,15,15,0.6); }
  .chat-head .title { color: var(--yellow); }
  .chat-head .count { color: var(--muted); font-size: 12px; font-weight: 400; }
  .chat-messages { height: 420px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-msg { background: rgba(15,15,15,0.7); padding: 10px 14px; border-radius: 10px; border-right: 3px solid var(--yellow); font-size: 13px; animation: slideUp 0.3s ease; max-width: 85%; }
  .chat-msg .n { font-weight: 700; font-size: 12px; color: var(--yellow); margin-bottom: 4px; }
  .chat-msg .t { color: var(--muted); font-size: 10px; margin-top: 5px; }
  .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: rgba(15,15,15,0.6); flex-wrap: wrap; }
  .chat-form input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 9px; font-size: 13px; font-family: inherit; transition: all 0.25s; }
  .chat-form input:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(250,204,21,0.15); }
  .chat-form input.name { width: 110px; }
  .chat-form input.text { flex: 1; min-width: 140px; }
  .chat-form button { background: linear-gradient(135deg, var(--yellow), var(--yellow-soft)); color: #000; border: none; padding: 11px 20px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 13px; font-family: inherit; transition: all 0.25s; }
  .chat-form button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(250,204,21,0.5); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px); background: linear-gradient(135deg, var(--yellow), var(--yellow-soft)); color: #000; padding: 13px 26px; border-radius: 10px; font-size: 13px; font-weight: 700; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 2000; box-shadow: 0 10px 40px rgba(250,204,21,0.5); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: #dc2626; color: #fff; }

  @media (max-width: 480px) {
    .chat-form input.name { width: 100%; }
    header h1 { font-size: 26px; }
    .tab { font-size: 13px; padding: 10px 4px; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<a href="/admin.html" class="admin-btn">🔐 ادمین</a>

<div class="container">
  <header>
    <div class="logo">🍌</div>
    <h1>موز کده</h1>
    <p>فضای اشتراک‌گذاری محتوا</p>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('content', this)">📦 محتواها</div>
    <div class="tab" onclick="switchTab('chat', this)">💬 چت</div>
  </div>

  <div id="content-section">
    <div id="content"><div class="empty"><div class="icon">⏳</div><p>در حال بارگذاری...</p></div></div>
  </div>

  <div id="chat-section" style="display:none;">
    <div class="chat-box">
      <div class="chat-head">
        <span class="title">💬 چت عمومی</span>
        <span class="count" id="chatCount">0 پیام</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-form" onsubmit="sendChat(event)">
        <input class="name" type="text" id="chatName" placeholder="نام" maxlength="30" required>
        <input class="text" type="text" id="chatText" placeholder="پیامت..." maxlength="300" required>
        <button type="submit">ارسال</button>
      </form>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
// ============ ذرات ============
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [], w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const COUNT = window.innerWidth < 600 ? 25 : 50;
  for (let i = 0; i < COUNT; i++) {
    particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+0.5, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, alpha: Math.random()*0.5+0.2, pulse: Math.random()*Math.PI*2 });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      gradient.addColorStop(0, `rgba(250, 204, 21, ${alpha})`);
      gradient.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 130) {
          ctx.strokeStyle = `rgba(250, 204, 21, ${(1 - dist/130) * 0.15})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ============ فیلتر فحش ============
const BAD_WORDS = ['کس','کیر','کون','جنده','حرومزاده','حروم زاده','مادرجنده','مادر جنده','گایید','گاییدم','گاییدن','بگا','بگای','سکس','سکسی','خارکسده','خار کسده','خارکسه','خار کسه','خارکس','احمق','ابله','نفهم','نفهمی','کثافت','چرت','مزخرف','fuck','shit','bitch','asshole','dick','pussy','cunt'];
function censor(text) {
  let result = text;
  BAD_WORDS.forEach(word => {
    const regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    result = result.replace(regex, '***');
  });
  return result;
}
function hasBadWord(text) {
  const lower = text.toLowerCase();
  return BAD_WORDS.some(w => lower.includes(w.toLowerCase()));
}

// ============ تب‌ها ============
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('content-section').style.display = name === 'content' ? 'block' : 'none';
  document.getElementById('chat-section').style.display = name === 'chat' ? 'block' : 'none';
  if (name === 'chat') loadChat();
}

// ============ لایک و بازدید ============
function hasLiked(type, id) {
  const key = 'mozLikes_' + type + '_' + id;
  return localStorage.getItem(key) === '1';
}

function markLiked(type, id) {
  const key = 'mozLikes_' + type + '_' + id;
  localStorage.setItem(key, '1');
}

async function likeItem(type, id, btn) {
  if (hasLiked(type, id)) {
    showToast('قبلاً لایک کردی 😊', true);
    return;
  }
  try {
    const endpoint = type === 'file' ? 'files' : 'texts';
    const res = await fetch(`/api/${endpoint}/${id}/like`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      markLiked(type, id);
      btn.classList.add('liked');
      btn.innerHTML = '❤️ لایک';
      // آپدیت شمارنده تو صفحه
      const card = btn.closest('.item, .code-card');
      const statsRow = card.querySelector('.stats-row');
      if (statsRow) {
        const spans = statsRow.querySelectorAll('span');
        // span دوم (index 1) شمارنده لایکه
        if (spans[1]) spans[1].innerHTML = '❤️ ' + data.likes;
      }
      showToast('❤️ لایک شد!', false);
    }
  } catch (e) {}
}

async function countView(type, id) {
  try {
    const endpoint = type === 'file' ? 'files' : 'texts';
    await fetch(`/api/${endpoint}/${id}/view`, { method: 'POST' });
  } catch (e) {}
}

// ============ «چند وقت پیش» ============
function timeAgo(dateStr) {
  const now = new Date();
  const then = new Date(dateStr);
  const diff = Math.floor((now - then) / 1000);

  if (diff < 60) return 'همین الان';
  if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
  if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
  if (diff < 604800) return Math.floor(diff / 86400) + ' روز پیش';
  return then.toLocaleDateString('fa-IR');
}

// ============ محتواها ============
async function loadContent() {
  const c = document.getElementById('content');
  try {
    const [filesRes, textsRes] = await Promise.all([
      fetch('/api/files'),
      fetch('/api/texts')
    ]);
    const files = await filesRes.json();
    const texts = await textsRes.json();

    const all = [
      ...files.map(f => ({ ...f, _kind: 'file', _date: f.uploadedAt })),
      ...texts.map(t => ({ ...t, _kind: 'text', _date: t.at }))
    ].sort((a, b) => new Date(b._date) - new Date(a._date));

    if (!all.length) {
      c.innerHTML = '<div class="empty"><div class="icon">🍌</div><p>هنوز محتوایی ارسال نشده</p></div>';
      return;
    }

    c.innerHTML = all.map(item => {
      if (item._kind === 'file') return renderFile(item);
      return renderText(item);
    }).join('');

    document.querySelectorAll('.code-body code').forEach(el => {
      try { hljs.highlightElement(el); } catch (e) {}
    });
  } catch (e) {
    c.innerHTML = '<div class="empty"><div class="icon">❌</div><p>خطا در بارگذاری</p></div>';
  }
}

function renderFile(f) {
  let preview = '';
  if (f.type === 'image') preview = `<img src="${f.url}" alt="" loading="lazy" onclick="openLightbox('${f.url}', '${f.id}')">`;
  else if (f.type === 'audio') preview = `<audio controls src="${f.url}" onplay="countView('file','${f.id}')"></audio>`;
  else if (f.type === 'video') preview = `<video controls src="${f.url}" onplay="countView('file','${f.id}')"></video>`;
  else preview = `<div class="file-icon">📄</div>`;

  const size = f.size < 1024*1024 ? (f.size/1024).toFixed(1)+' KB' : (f.size/1024/1024).toFixed(1)+' MB';
  const date = timeAgo(f.uploadedAt);
  const likes = f.likes || 0;
  const views = f.views || 0;
  const liked = hasLiked('file', f.id);

  return `
    <div class="item">
      ${preview}
      <div class="meta">
        <div class="info">
          <div class="name">${escapeHtml(f.originalName)}</div>
          <div class="stats-row">
            <span>👁 ${views}</span>
            <span>❤️ ${likes}</span>
            <span>${size} • ${date}</span>
          </div>
        </div>
        <a href="${f.url}" download="${escapeHtml(f.originalName)}" class="btn-dl" onclick="countView('file','${f.id}')">⬇ دانلود</a>
      </div>
      <div class="actions-row">
        <button class="like-btn ${liked ? 'liked' : ''}" onclick="likeItem('file','${f.id}', this)">
          ${liked ? '❤️' : '🤍'} لایک
        </button>
      </div>
    </div>`;
}

function renderText(t) {
  const date = timeAgo(t.at);
  const size = t.size < 1024 ? t.size + ' B' : (t.size/1024).toFixed(1) + ' KB';
  const isCode = t.lang && t.lang !== 'text';
  const likes = t.likes || 0;
  const views = t.views || 0;
  const liked = hasLiked('text', t.id);

  const statsHtml = `
    <div class="stats-row" style="padding: 0 16px 10px;">
      <span>👁 ${views}</span>
      <span>❤️ ${likes}</span>
      <span>${size} • ${date}</span>
    </div>`;

  const likeHtml = `
    <div class="actions-row" style="margin: 0 16px 16px; padding-top: 10px;">
      <button class="like-btn ${liked ? 'liked' : ''}" onclick="event.stopPropagation(); likeItem('text','${t.id}', this)">
        ${liked ? '❤️' : '🤍'} لایک
      </button>
    </div>`;

  if (isCode) {
    return `
      <div class="code-card" onclick="countView('text','${t.id}')">
        <div class="code-head">
          <div class="title-wrap">
            <div class="title">${escapeHtml(t.title)}</div>
            <span class="lang-badge">${escapeHtml(t.lang)}</span>
          </div>
          <button class="copy-btn" onclick="event.stopPropagation(); copyText('${t.id}', this)">📋 کپی</button>
        </div>
        <div class="code-body">
          <pre><code class="language-${escapeHtml(t.lang)}" id="code-${t.id}">${escapeHtml(t.content)}</code></pre>
        </div>
        ${statsHtml}
        ${likeHtml}
      </div>`;
  } else {
    return `
      <div class="code-card" onclick="countView('text','${t.id}')">
        <div class="code-head">
          <div class="title-wrap">
            <div class="title">${escapeHtml(t.title)}</div>
            <span class="lang-badge">متن</span>
          </div>
          <button class="copy-btn" onclick="event.stopPropagation(); copyText('${t.id}', this)">📋 کپی</button>
        </div>
        <div class="code-text" id="code-${t.id}">${escapeHtml(t.content)}</div>
        ${statsHtml}
        ${likeHtml}
      </div>`;
  }
}

function copyText(id, btn) {
  const el = document.getElementById('code-' + id);
  if (!el) return;
  const text = el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ کپی شد';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 کپی';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ کپی شد';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 کپی';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ============ Lightbox ============
function openLightbox(src, id) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
  if (id) countView('file', id);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ============ چت ============
async function loadChat() {
  try {
    const res = await fetch('/api/chat');
    const msgs = await res.json();
    const box = document.getElementById('chatMessages');
    document.getElementById('chatCount').textContent = msgs.length + ' پیام';
    if (!msgs.length) {
      box.innerHTML = '<div class="empty" style="padding:20px;"><p style="font-size:13px;">هنوز پیامی نیست. اولین نفر باش!</p></div>';
      return;
    }
    box.innerHTML = msgs.map(m => {
      const time = new Date(m.at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
      return `<div class="chat-msg">
        <div class="n">${escapeHtml(m.name)}</div>
        <div>${escapeHtml(censor(m.message))}</div>
        <div class="t">${time}</div>
      </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function sendChat(e) {
  e.preventDefault();
  const name = document.getElementById('chatName').value.trim();
  const text = document.getElementById('chatText').value.trim();
  if (!name || !text) return;
  if (hasBadWord(name) || hasBadWord(text)) {
    showToast('⛔ کلمات نامناسب در پیام شماست', true);
    return;
  }
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, message: text })
    });
    if (res.ok) {
      document.getElementById('chatText').value = '';
      loadChat();
    } else {
      showToast('خطا در ارسال', true);
    }
  } catch (e) {
    showToast('خطا در ارتباط', true);
  }
}

// ============ Toast ============
function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

// ============ شروع ============
loadContent();
setInterval(loadContent, 30000);
setInterval(() => {
  if (document.getElementById('chat-section').style.display !== 'none') loadChat();
}, 5000);
</script>
