<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍌 موز کده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #262626;
    --text: #e5e5e5;
    --muted: #8a8a8a;
    --accent: #fff;
    --hover: #1f1f1f;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 120px;
    line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; }

  header { text-align: center; padding: 24px 0 32px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  header h1 { font-size: 28px; font-weight: 600; letter-spacing: 2px; }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 24px;
    background: var(--card); padding: 4px; border-radius: 10px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 10px; text-align: center; cursor: pointer;
    border-radius: 7px; color: var(--muted); font-size: 14px;
    transition: all 0.15s;
  }
  .tab.active { background: var(--accent); color: #000; font-weight: 600; }

  .item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .item img {
    max-width: 100%; border-radius: 8px; cursor: zoom-in;
    display: block; margin: 0 auto; filter: grayscale(0.3);
    transition: filter 0.2s;
  }
  .item img:hover { filter: grayscale(0); }
  .item audio, .item video { width: 100%; border-radius: 8px; }
  .item .file-icon { font-size: 48px; text-align: center; padding: 20px; }
  .item .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); gap: 10px;
  }
  .item .meta .name { font-weight: 500; color: var(--text); word-break: break-all; font-size: 13px; }
  .item .meta .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .btn-dl {
    background: var(--accent); color: #000; padding: 8px 14px;
    border-radius: 7px; text-decoration: none; font-size: 12px;
    font-weight: 600; white-space: nowrap; transition: opacity 0.15s;
  }
  .btn-dl:hover { opacity: 0.8; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 60px; opacity: 0.3; margin-bottom: 12px; }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.95); justify-content: center; align-items: center;
    padding: 20px; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95%; max-height: 95%; border-radius: 4px; }
  .lightbox .close {
    position: absolute; top: 20px; left: 20px;
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
  }

  /* Chat */
  .chat-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .chat-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600; display: flex;
    justify-content: space-between; align-items: center;
  }
  .chat-head .count { color: var(--muted); font-size: 12px; font-weight: 400; }
  .chat-messages {
    height: 400px; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .chat-msg {
    background: var(--hover); padding: 10px 14px; border-radius: 10px;
    border-right: 2px solid var(--accent); font-size: 13px;
  }
  .chat-msg .n { font-weight: 600; font-size: 12px; color: var(--accent); margin-bottom: 3px; }
  .chat-msg .t { color: var(--muted); font-size: 10px; margin-top: 4px; }
  .chat-form {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border);
    background: #0f0f0f; flex-wrap: wrap;
  }
  .chat-form input {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .chat-form input.name { width: 100px; }
  .chat-form input.text { flex: 1; min-width: 150px; }
  .chat-form button {
    background: var(--accent); color: #000; border: none;
    padding: 10px 18px; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 13px; font-family: inherit;
  }
  .chat-form button:hover { opacity: 0.85; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #fff; color: #000; padding: 12px 24px; border-radius: 8px;
    font-size: 13px; font-weight: 500; transition: transform 0.3s; z-index: 2000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: #dc2626; color: #fff; }

  @media (max-width: 480px) {
    .chat-form input.name { width: 100%; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍌 موز کده</h1>
    <p>فضای اشتراک‌گذاری محتوا</p>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('content', this)">📦 محتواها</div>
    <div class="tab" onclick="switchTab('chat', this)">💬 چت</div>
  </div>

  <div id="content-section">
    <div id="content"><div class="empty"><div class="icon">⏳</div><p>در حال بارگذاری...</p></div></div>
  </div>

  <div id="chat-section" style="display:none;">
    <div class="chat-box">
      <div class="chat-head">
        <span>💬 چت عمومی</span>
        <span class="count" id="chatCount">0 پیام</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-form" onsubmit="sendChat(event)">
        <input class="name" type="text" id="chatName" placeholder="نام" maxlength="30" required>
        <input class="text" type="text" id="chatText" placeholder="پیامت..." maxlength="300" required>
        <button type="submit">ارسال</button>
      </form>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
// ============ فیلتر فحش ============
const BAD_WORDS = [
  'کس', 'کیر', 'کون', 'جنده', 'حرومزاده', 'حروم زاده', 'مادرجنده', 'مادر جنده',
  'گایید', 'گاییدم', 'گاییدن', 'بگا', 'بگای', 'سکس', 'سکسی',
  'خارکسده', 'خار کسده', 'خارکسه', 'خار کسه', 'خارکس',
  'احمق', 'ابله', 'نفهم', 'نفهمی', 'کثافت', 'چرت', 'مزخرف',
  'fuck', 'shit', 'bitch', 'asshole', 'dick', 'pussy', 'cunt'
];

function censor(text) {
  let result = text;
  BAD_WORDS.forEach(word => {
    const regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    result = result.replace(regex, '***');
  });
  return result;
}

function hasBadWord(text) {
  const lower = text.toLowerCase();
  return BAD_WORDS.some(w => lower.includes(w.toLowerCase()));
}

// ============ تب‌ها ============
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('content-section').style.display = name === 'content' ? 'block' : 'none';
  document.getElementById('chat-section').style.display = name === 'chat' ? 'block' : 'none';
  if (name === 'chat') loadChat();
}

// ============ محتواها ============
async function loadFiles() {
  const c = document.getElementById('content');
  try {
    const res = await fetch('/api/files');
    const files = await res.json();
    if (!files.length) {
      c.innerHTML = '<div class="empty"><div class="icon">🍌</div><p>هنوز محتوایی آپلود نشده</p></div>';
      return;
    }
    c.innerHTML = files.map(f => {
      let preview = '';
      if (f.type === 'image') preview = `<img src="${f.url}" alt="" loading="lazy" onclick="openLightbox('${f.url}')">`;
      else if (f.type === 'audio') preview = `<audio controls src="${f.url}"></audio>`;
      else if (f.type === 'video') preview = `<video controls src="${f.url}"></video>`;
      else preview = `<div class="file-icon">📄</div>`;

      const size = (f.size / 1024).toFixed(1) + ' KB';
      const date = new Date(f.uploadedAt).toLocaleDateString('fa-IR');

      return `
        <div class="item">
          ${preview}
          <div class="meta">
            <div class="info">
              <div class="name">${f.originalName}</div>
              <span>${size} • ${date}</span>
            </div>
            <a href="${f.url}" download="${f.originalName}" class="btn-dl">⬇ دانلود</a>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    c.innerHTML = '<div class="empty"><div class="icon">❌</div><p>خطا در بارگذاری</p></div>';
  }
}

// ============ Lightbox ============
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ============ چت ============
async function loadChat() {
  try {
    const res = await fetch('/api/chat');
    const msgs = await res.json();
    const box = document.getElementById('chatMessages');
    document.getElementById('chatCount').textContent = msgs.length + ' پیام';

    if (!msgs.length) {
      box.innerHTML = '<div class="empty" style="padding:20px;"><p style="font-size:13px;">هنوز پیامی نیست. اولین نفر باش!</p></div>';
      return;
    }
    box.innerHTML = msgs.map(m => {
      const time = new Date(m.at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
      return `<div class="chat-msg">
        <div class="n">${escapeHtml(m.name)}</div>
        <div>${escapeHtml(censor(m.message))}</div>
        <div class="t">${time}</div>
      </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function sendChat(e) {
  e.preventDefault();
  const name = document.getElementById('chatName').value.trim();
  const text = document.getElementById('chatText').value.trim();

  if (!name || !text) return;

  if (hasBadWord(name) || hasBadWord(text)) {
    showToast('⛔ کلمات نامناسب در پیام شماست', true);
    return;
  }

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, message: text })
    });
    if (res.ok) {
      document.getElementById('chatText').value = '';
      loadChat();
    } else {
      showToast('خطا در ارسال', true);
    }
  } catch (e) {
    showToast('خطا در ارتباط', true);
  }
}

// ============ Toast ============
function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

// ============ شروع ============
loadFiles();
setInterval(loadFiles, 30000);
setInterval(() => {
  if (document.getElementById('chat-section').style.display !== 'none') loadChat();
}, 5000);
</script>
</body>
</html>
