<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍌 موز کده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  :root {
    --bg: #0a0a0a;
    --bg2: #0f0f0f;
    --card: #151515;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #8a8a8a;
    --yellow: #facc15;
    --yellow-soft: #fde047;
    --yellow-dark: #a16207;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 120px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
  }

  /* ============ ذرات پس‌زمینه ============ */
  #particles {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }
  .container {
    max-width: 720px; margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* ============ دکمه ادمین ============ */
  .admin-btn {
    position: fixed; top: 16px; left: 16px;
    background: rgba(21,21,21,0.85); color: var(--yellow);
    border: 1px solid var(--yellow); padding: 9px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 700;
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: all 0.25s; z-index: 100;
    box-shadow: 0 4px 20px rgba(250,204,21,0.15);
    backdrop-filter: blur(10px);
  }
  .admin-btn:hover {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(250,204,21,0.5);
  }

  /* ============ هدر ============ */
  header {
    text-align: center; padding: 20px 0 28px;
    border-bottom: 1px solid var(--border); margin-bottom: 28px;
  }
  header .logo {
    font-size: 56px; display: inline-block;
    animation: float 3.5s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(250,204,21,0.4));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }
  header h1 {
    font-size: 32px; font-weight: 800; letter-spacing: 3px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 25px rgba(250,204,21,0.3));
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  /* ============ تب‌ها ============ */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 24px;
    background: rgba(21,21,21,0.7); padding: 4px; border-radius: 12px;
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }
  .tab {
    flex: 1; padding: 12px; text-align: center; cursor: pointer;
    border-radius: 9px; color: var(--muted); font-size: 14px;
    font-weight: 600; transition: all 0.3s ease;
    user-select: none;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000;
    box-shadow: 0 4px 25px rgba(250,204,21,0.35);
  }

  /* ============ کارت محتوا ============ */
  .item {
    background: rgba(21,21,21,0.85);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
    transition: all 0.35s ease;
    animation: slideUp 0.5s ease both;
    position: relative; overflow: hidden;
    backdrop-filter: blur(10px);
  }
  .item::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--yellow), transparent);
    opacity: 0.7;
  }
  .item:hover {
    border-color: rgba(250,204,21,0.5);
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 30px rgba(250,204,21,0.1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .item img {
    max-width: 100%; border-radius: 10px; cursor: zoom-in;
    display: block; margin: 0 auto;
    transition: transform 0.4s ease, filter 0.4s;
    filter: saturate(0.85);
  }
  .item img:hover { transform: scale(1.02); filter: saturate(1.15); }
  .item audio, .item video { width: 100%; border-radius: 10px; }
  .item .file-icon { font-size: 52px; text-align: center; padding: 24px; }

  .item .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); gap: 10px;
  }
  .item .meta .name { font-weight: 600; color: var(--text); word-break: break-all; font-size: 13px; }
  .item .meta .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }

  .btn-dl {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; padding: 9px 16px; border-radius: 8px;
    text-decoration: none; font-size: 12px; font-weight: 700;
    white-space: nowrap; transition: all 0.25s;
    border: none; cursor: pointer;
  }
  .btn-dl:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(250,204,21,0.5);
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 64px; opacity: 0.3; margin-bottom: 14px; }

  /* ============ Lightbox ============ */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.96); justify-content: center; align-items: center;
    padding: 20px; cursor: zoom-out;
    backdrop-filter: blur(14px);
  }
  .lightbox.open { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lightbox img {
    max-width: 95%; max-height: 95%; border-radius: 8px;
    box-shadow: 0 0 80px rgba(250,204,21,0.3);
    animation: zoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes zoomIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .lightbox .close {
    position: absolute; top: 20px; left: 20px;
    background: rgba(250,204,21,0.15); border: 1px solid var(--yellow);
    color: var(--yellow); width: 44px; height: 44px; border-radius: 50%;
    cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
  }
  .lightbox .close:hover {
    background: var(--yellow); color: #000;
    transform: rotate(90deg);
  }

  /* ============ چت ============ */
  .chat-box {
    background: rgba(21,21,21,0.85);
    border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
    animation: slideUp 0.5s ease;
    backdrop-filter: blur(10px);
  }
  .chat-head {
    padding: 16px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(15,15,15,0.6);
  }
  .chat-head .title { color: var(--yellow); }
  .chat-head .count { color: var(--muted); font-size: 12px; font-weight: 400; }

  .chat-messages {
    height: 420px; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 3px;
  }
  .chat-messages::-webkit-scrollbar-thumb:hover { background: var(--yellow-dark); }

  .chat-msg {
    background: rgba(15,15,15,0.7); padding: 10px 14px;
    border-radius: 10px; border-right: 3px solid var(--yellow);
    font-size: 13px; animation: slideUp 0.3s ease;
    max-width: 85%;
  }
  .chat-msg .n {
    font-weight: 700; font-size: 12px;
    color: var(--yellow); margin-bottom: 4px;
  }
  .chat-msg .t { color: var(--muted); font-size: 10px; margin-top: 5px; }

  .chat-form {
    display: flex; gap: 8px; padding: 12px;
    border-top: 1px solid var(--border);
    background: rgba(15,15,15,0.6); flex-wrap: wrap;
  }
  .chat-form input {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 11px 14px; border-radius: 9px;
    font-size: 13px; font-family: inherit;
    transition: all 0.25s;
  }
  .chat-form input:focus {
    outline: none; border-color: var(--yellow);
    box-shadow: 0 0 0 3px rgba(250,204,21,0.15);
  }
  .chat-form input.name { width: 110px; }
  .chat-form input.text { flex: 1; min-width: 140px; }
  .chat-form button {
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; border: none; padding: 11px 20px; border-radius: 9px;
    cursor: pointer; font-weight: 700; font-size: 13px; font-family: inherit;
    transition: all 0.25s;
  }
  .chat-form button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(250,204,21,0.5);
  }

  /* ============ Toast ============ */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: linear-gradient(135deg, var(--yellow), var(--yellow-soft));
    color: #000; padding: 13px 26px; border-radius: 10px;
    font-size: 13px; font-weight: 700;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 2000;
    box-shadow: 0 10px 40px rgba(250,204,21,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error {
    background: #dc2626; color: #fff;
    box-shadow: 0 10px 40px rgba(220,38,38,0.5);
  }

  @media (max-width: 480px) {
    .chat-form input.name { width: 100%; }
    header h1 { font-size: 26px; }
    .admin-btn { padding: 8px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<a href="/admin.html" class="admin-btn">🔐 ادمین</a>

<div class="container">
  <header>
    <div class="logo">🍌</div>
    <h1>موز کده</h1>
    <p>فضای اشتراک‌گذاری محتوا</p>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('content', this)">📦 محتواها</div>
    <div class="tab" onclick="switchTab('chat', this)">💬 چت</div>
  </div>

  <div id="content-section">
    <div id="content"><div class="empty"><div class="icon">⏳</div><p>در حال بارگذاری...</p></div></div>
  </div>

  <div id="chat-section" style="display:none;">
    <div class="chat-box">
      <div class="chat-head">
        <span class="title">💬 چت عمومی</span>
        <span class="count" id="chatCount">0 پیام</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-form" onsubmit="sendChat(event)">
        <input class="name" type="text" id="chatName" placeholder="نام" maxlength="30" required>
        <input class="text" type="text" id="chatText" placeholder="پیامت..." maxlength="300" required>
        <button type="submit">ارسال</button>
      </form>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
// ============ ذرات زرد ============
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = window.innerWidth < 600 ? 25 : 50;

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.2,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += 0.02;

      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;

      // هاله
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      gradient.addColorStop(0, `rgba(250, 204, 21, ${alpha})`);
      gradient.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2);
      ctx.fill();

      // هسته
      ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // خطوط بین ذرات نزدیک
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 130) {
          const opacity = (1 - dist / 130) * 0.15;
          ctx.strokeStyle = `rgba(250, 204, 21, ${opacity})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }
  draw();
})();

// ============ فیلتر فحش ============
const BAD_WORDS = [
  'کس', 'کیر', 'کون', 'جنده', 'حرومزاده', 'حروم زاده', 'مادرجنده', 'مادر جنده',
  'گایید', 'گاییدم', 'گاییدن', 'بگا', 'بگای', 'سکس', 'سکسی',
  'خارکسده', 'خار کسده', 'خارکسه', 'خار کسه', 'خارکس',
  'احمق', 'ابله', 'نفهم', 'نفهمی', 'کثافت', 'چرت', 'مزخرف',
  'fuck', 'shit', 'bitch', 'asshole', 'dick', 'pussy', 'cunt'
];

function censor(text) {
  let result = text;
  BAD_WORDS.forEach(word => {
    const regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    result = result.replace(regex, '***');
  });
  return result;
}

function hasBadWord(text) {
  const lower = text.toLowerCase();
  return BAD_WORDS.some(w => lower.includes(w.toLowerCase()));
}

// ============ تب‌ها ============
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('content-section').style.display = name === 'content' ? 'block' : 'none';
  document.getElementById('chat-section').style.display = name === 'chat' ? 'block' : 'none';
  if (name === 'chat') loadChat();
}

// ============ محتواها ============
async function loadFiles() {
  const c = document.getElementById('content');
  try {
    const res = await fetch('/api/files');
    const files = await res.json();
    if (!files.length) {
      c.innerHTML = '<div class="empty"><div class="icon">🍌</div><p>هنوز محتوایی آپلود نشده</p></div>';
      return;
    }
    c.innerHTML = files.map(f => {
      let preview = '';
      if (f.type === 'image') preview = `<img src="${f.url}" alt="" loading="lazy" onclick="openLightbox('${f.url}')">`;
      else if (f.type === 'audio') preview = `<audio controls src="${f.url}"></audio>`;
      else if (f.type === 'video') preview = `<video controls src="${f.url}"></video>`;
      else preview = `<div class="file-icon">📄</div>`;

      const size = (f.size / 1024).toFixed(1) + ' KB';
      const date = new Date(f.uploadedAt).toLocaleDateString('fa-IR');

      return `
        <div class="item">
          ${preview}
          <div class="meta">
            <div class="info">
              <div class="name">${f.originalName}</div>
              <span>${size} • ${date}</span>
            </div>
            <a href="${f.url}" download="${f.originalName}" class="btn-dl">⬇ دانلود</a>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    c.innerHTML = '<div class="empty"><div class="icon">❌</div><p>خطا در بارگذاری</p></div>';
  }
}

// ============ Lightbox ============
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ============ چت ============
async function loadChat() {
  try {
    const res = await fetch('/api/chat');
    const msgs = await res.json();
    const box = document.getElementById('chatMessages');
    document.getElementById('chatCount').textContent = msgs.length + ' پیام';

    if (!msgs.length) {
      box.innerHTML = '<div class="empty" style="padding:20px;"><p style="font-size:13px;">هنوز پیامی نیست. اولین نفر باش!</p></div>';
      return;
    }
    box.innerHTML = msgs.map(m => {
      const time = new Date(m.at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
      return `<div class="chat-msg">
        <div class="n">${escapeHtml(m.name)}</div>
        <div>${escapeHtml(censor(m.message))}</div>
        <div class="t">${time}</div>
      </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function sendChat(e) {
  e.preventDefault();
  const name = document.getElementById('chatName').value.trim();
  const text = document.getElementById('chatText').value.trim();

  if (!name || !text) return;

  if (hasBadWord(name) || hasBadWord(text)) {
    showToast('⛔ کلمات نامناسب در پیام شماست', true);
    return;
  }

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, message: text })
    });
    if (res.ok) {
      document.getElementById('chatText').value = '';
      loadChat();
    } else {
      showToast('خطا در ارسال', true);
    }
  } catch (e) {
    showToast('خطا در ارتباط', true);
  }
}

// ============ Toast ============
function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

// ============ شروع ============
loadFiles();
setInterval(loadFiles, 30000);
setInterval(() => {
  if (document.getElementById('chat-section').style.display !== 'none') loadChat();
}, 5000);
</script>
</body>
</html>
